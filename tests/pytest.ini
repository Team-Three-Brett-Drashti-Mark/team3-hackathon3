[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    -v
    --strict-markers

norecursedirs =
    venv
    node_modules
    .git
    frontend
    __pycache__
    ingestion

markers =
    unit: pure unit tests with no I/O
    integration: tests that compose multiple components
    slow: tests that take longer (excluded from fast CI runs)
