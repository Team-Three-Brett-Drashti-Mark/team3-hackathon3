# =============================================================================
# Curriculum ETL Job
# =============================================================================
# Two-task DAG that runs whenever a new file lands in the curriculum bronze
# volume. The DAG is intentionally minimal — silver chunking first, vector
# sync second — and matches the medallion architecture we already use.
#
# Trigger: file_arrival on /Volumes/capstone/bronze_layer/curriculum_raw/
#   - The admin UI uploads land in week_XX/{markdown|pdfs|quizzes}/ inside
#     this root (see app/admin.py:upload_file). Any write under the root
#     fires this trigger.
#   - We debounce so a multi-file upload doesn't fire N runs.
#
# Tasks:
#   silver_chunking → MERGEs new chunks into capstone.silver_layer.curriculum_chunks
#   vector_sync     → projects silver → vector_store, MERGEs, fires index.sync()
#
# Compute: serverless (no new_cluster block). Spark Python tasks default to
# serverless when no cluster is specified, which is the right call here:
# the workload is short (< 2 min per run), serverless eliminates cold-start
# pain, and we don't need cluster-level customization.
#
# Source files are uploaded by `databricks bundle deploy` from this repo's
# ingestion/pipelines/ directory into the user's workspace files area.
# =============================================================================

resources:
  jobs:
    curriculum_etl:
      name: "[${bundle.target}] Curriculum ETL"
      description: >
        Triggered when files arrive in the curriculum bronze volume.
        Chunks markdown + JSON quiz files into the silver layer, then syncs
        the vector store and fires a vector search index update. See
        ingestion/pipelines/ for task source. Configured by
        resources/curriculum_etl.yml.

      # Only one run at a time. If a second trigger fires while we're still
      # processing the first batch, it queues. With max_concurrent_runs>1 we
      # could end up with two MERGEs racing on the same silver rows; not
      # catastrophic (MERGE is atomic per-statement) but wasted work.
      max_concurrent_runs: 1

      # File-arrival trigger: monitor the entire bronze curriculum volume.
      # wait_after_last_change_seconds gives a bursty upload (admin dragging
      # in 5 files at once) time to settle into one job run.
      # min_time_between_triggers_seconds caps how often the trigger can fire
      # so a rapid sequence of single uploads doesn't spawn many runs.
      #
      # Note: the Databricks Jobs API enforces a minimum of >60s on
      # wait_after_last_change_seconds. Using 90s here as a safe value above
      # the floor — gives an admin uploading a folder of files time to
      # finish without splitting the batch across multiple runs.
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: "/Volumes/capstone/bronze_layer/curriculum_raw/"
          wait_after_last_change_seconds: 90
          min_time_between_triggers_seconds: 60

      # Serverless environments shared by both tasks. Spark Python tasks
      # require an environment_key (unlike notebook tasks) to opt into
      # serverless compute — without one, the CLI demands a job_cluster_key
      # or new_cluster spec.
      #
      # We define two environments because the two tasks need different deps
      # (LangChain for chunking, vectorsearch SDK for sync) and there's no
      # point installing both into both task containers. `client: "2"` is
      # the current serverless client major version; bump when Databricks
      # ships a new one.
      environments:
        - environment_key: chunking_env
          spec:
            client: "2"
            dependencies:
              # Pinned to match the original notebook so chunk_ids stay
              # stable across the ipynb → .py migration.
              - "langchain-text-splitters==1.1.1"
        - environment_key: vector_env
          spec:
            client: "2"
            dependencies:
              - "databricks-vectorsearch"

      tasks:
        # ─── Task 1: chunk new/changed files into silver ──────────────────
        - task_key: silver_chunking
          description: >
            Walk the bronze volume, chunk markdown + quizzes, MERGE rows into
            capstone.silver_layer.curriculum_chunks. Idempotent on chunk_id.
          environment_key: chunking_env
          spark_python_task:
            # Path is relative to this YAML file. The CLI uploads everything
            # under the bundle to the workspace, then rewrites the path to
            # the deployed location at deploy time.
            python_file: ../ingestion/pipelines/silver_chunking.py

        # ─── Task 2: sync silver → vector store + fire index sync ─────────
        - task_key: vector_sync
          description: >
            Project silver chunks into the vector_store schema, MERGE on id,
            then trigger the Delta Sync vector search index update.
          depends_on:
            - task_key: silver_chunking
          # Fires only when silver_chunking succeeds. If chunking failed we
          # do NOT want a partial silver → vector sync, because the index
          # could end up reflecting a half-applied batch.
          run_if: ALL_SUCCESS
          environment_key: vector_env
          spark_python_task:
            python_file: ../ingestion/pipelines/vector_sync.py

      # Permissions stay loose for the hackathon. Tighten before any prod
      # cutover — at minimum, lock CAN_MANAGE to the maintainers group.
      # permissions:
      #   - level: CAN_VIEW
      #     group_name: "users"
      #   - level: CAN_MANAGE
      #     user_name: "w.brett.coleman@gmail.com"
