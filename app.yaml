command:
  - bash
  - -lc
  - |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      cd frontend
      npm ci
      npm run build
      cd ..
      uvicorn app.api:app --host 0.0.0.0 --port 8000

env:
  - name: GROQ_API_KEY
    value: {{secrets/pathwise-secrets/GROQ_API_KEY}}
  - name: DATABRICKS_HOST
    value: {{secrets/pathwise-secrets/DATABRICKS_HOST}}
  - name: DATABRICKS_TOKEN
    value: {{secrets/pathwise-secrets/DATABRICKS_TOKEN}}
